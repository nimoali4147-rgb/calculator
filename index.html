<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="calculator" class="bg-black/70 w-100 ml-118 h-122 mt-20 rounded-xl">
        <input id="display" readonly class=" bg-black/40 text-white font-bold text-xl px-4 rounded-t-xl w-full h-30">
        <div id="keys" class="grid grid-cols-4 gap-4 p-5 text-white font-bold text-2xl">

            <button onclick="appendToDisplay('+')"
                class="w-13 h-13 rounded-full bg-yellow-500 hover:bg-yellow-300 flex justify-center pb-2 pr-1 items-center text-2xl transition">+</button>

            <button onclick="appendToDisplay('9')"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">9</button>

            <button onclick="appendToDisplay('8')"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">8</button>

            <button onclick="appendToDisplay('7')"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">7</button>
            <button onclick="appendToDisplay(`-`)"
                class="w-13 h-13 rounded-full bg-yellow-500 hover:bg-yellow-300 flex justify-center items-center text-2xl transition">-</button>
            <button onclick="appendToDisplay(`6`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">6</button>
            <button onclick="appendToDisplay(`5`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">5</button>
            <button onclick="appendToDisplay(`4`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">4</button>
            <button onclick="appendToDisplay(`*`)"
                class="w-13 h-13 rounded-full bg-yellow-500 hover:bg-yellow-300 flex justify-center -pb-8 items-center text-3xl transition">*</button>
            <button onclick="appendToDisplay(`1`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">1</button>
            <button onclick="appendToDisplay(`2`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">2</button>
            <button onclick="appendToDisplay(`3`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">3</button>
            <button onclick="appendToDisplay(`/`)"
                class="w-13 h-13 rounded-full bg-yellow-500 hover:bg-yellow-300 flex justify-center items-center text-2xl transition">/</button>
            <button onclick="appendToDisplay(`0`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">0</button>
            <button onclick="appendToDisplay(`.`)"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center pb-4 items-center text-2xl transition">.</button>
            <button onclick="calculate()"
                class="w-13 h-13 rounded-full bg-black/40 hover:bg-black/50 flex justify-center items-center text-2xl transition">=</button>
            <button onclick="clearDisplay()"
                class="w-13 h-13 rounded-full bg-yellow-500 hover:bg-yellow-300 flex justify-center pb-3 pr-1 items-center text-2xl transition">c</button>

        </div>

    </div>
<script src="script.js"></script>
</body>

</html>
